<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AwajDigital Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .toast { transition: opacity 0.3s ease, transform 0.3s ease; }
        .hidden-section { display: none; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen font-sans">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-gray-800">AwajDigital</div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="showSection('dashboard')" class="w-full text-left p-3 rounded hover:bg-gray-800"><i class="fas fa-home mr-2"></i> Dashboard</button>
            <button onclick="showSection('otp')" class="w-full text-left p-3 rounded hover:bg-gray-800"><i class="fas fa-key mr-2"></i> Send OTP</button>
            <button onclick="showSection('bulk')" class="w-full text-left p-3 rounded hover:bg-gray-800"><i class="fas fa-bullhorn mr-2"></i> Bulk Broadcast</button>
            <button onclick="showSection('upload')" class="w-full text-left p-3 rounded hover:bg-gray-800"><i class="fas fa-microphone mr-2"></i> Upload Voice</button>
            <button onclick="showSection('settings')" class="w-full text-left p-3 rounded hover:bg-gray-800"><i class="fas fa-cog mr-2"></i> Settings</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto relative">
        
        <!-- Toast Container -->
        <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2"></div>

        <!-- Dashboard -->
        <section id="dashboard" class="hidden-section block">
            <h1 class="text-3xl font-bold mb-6">Dashboard</h1>
            <div class="bg-white p-6 rounded-lg shadow w-64">
                <h3 class="text-gray-500 mb-2">Current Balance (BDT)</h3>
                <div id="balance-display" class="text-4xl font-bold text-blue-600">--</div>
                <button onclick="checkBalance()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Refresh Balance</button>
            </div>
        </section>

        <!-- Send OTP -->
        <section id="otp" class="hidden-section">
            <h1 class="text-3xl font-bold mb-6">Send Voice OTP</h1>
            <div class="bg-white p-6 rounded-lg shadow max-w-lg">
                <form onsubmit="sendOTP(event)" class="space-y-4">
                    <div>
                        <label class="block font-medium mb-1">Sender ID</label>
                        <select id="otp-sender" class="w-full border p-2 rounded dynamic-senders" required></select>
                    </div>
                    <div>
                        <label class="block font-medium mb-1">Voice</label>
                        <select id="otp-voice" class="w-full border p-2 rounded dynamic-voices" required></select>
                    </div>
                    <div>
                        <label class="block font-medium mb-1">Phone Number</label>
                        <input type="text" id="otp-phone" class="w-full border p-2 rounded" placeholder="019XXXXXXXX" required>
                    </div>
                    <div>
                        <label class="block font-medium mb-1">OTP Code</label>
                        <input type="text" id="otp-code" class="w-full border p-2 rounded" placeholder="1234" required>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Send OTP</button>
                </form>
            </div>
        </section>

        <!-- Bulk Broadcast -->
        <section id="bulk" class="hidden-section">
            <h1 class="text-3xl font-bold mb-6">Bulk Broadcast</h1>
            <div class="bg-white p-6 rounded-lg shadow max-w-lg">
                <form onsubmit="sendBulk(event)" class="space-y-4">
                    <div>
                        <label class="block font-medium mb-1">Sender ID</label>
                        <select id="bulk-sender" class="w-full border p-2 rounded dynamic-senders" required></select>
                    </div>
                    <div>
                        <label class="block font-medium mb-1">Voice</label>
                        <select id="bulk-voice" class="w-full border p-2 rounded dynamic-voices" required></select>
                    </div>
                    <div>
                        <label class="block font-medium mb-1">Phone Numbers (Comma separated)</label>
                        <textarea id="bulk-phones" class="w-full border p-2 rounded h-32" placeholder="019XXXXXXX, 018XXXXXXX" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Send Broadcast</button>
                </form>
            </div>
        </section>

        <!-- Upload Voice -->
        <section id="upload" class="hidden-section">
            <h1 class="text-3xl font-bold mb-6">Upload Voice</h1>
            <div class="bg-white p-6 rounded-lg shadow max-w-lg">
                <form onsubmit="uploadVoice(event)" class="space-y-4">
                    <div>
                        <label class="block font-medium mb-1">Voice Name</label>
                        <input type="text" id="voice-name" class="w-full border p-2 rounded" required>
                    </div>
                    <div>
                        <label class="block font-medium mb-1">Audio File (MP3/WAV)</label>
                        <input type="file" id="voice-file" class="w-full border p-2 rounded" accept="audio/*" required>
                    </div>
                    <button type="submit" class="w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700">Upload</button>
                </form>
            </div>
        </section>

        <!-- Settings -->
        <section id="settings" class="hidden-section">
            <h1 class="text-3xl font-bold mb-6">Settings</h1>
            <div class="bg-white p-6 rounded-lg shadow max-w-lg">
                <div class="space-y-4">
                    <div>
                        <label class="block font-medium mb-1">API Token</label>
                        <input type="password" id="api-token" class="w-full border p-2 rounded" placeholder="Paste your API token here">
                    </div>
                    <button onclick="saveToken()" class="w-full bg-gray-800 text-white py-2 rounded hover:bg-gray-900">Save Token</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Vercel Rewrite URL
        const BASE_URL = '/awaj-api';

        // Load Token
        let API_TOKEN = localStorage.getItem('awaj_token') || '';
        if(API_TOKEN) {
            document.getElementById('api-token').value = API_TOKEN;
            initData();
        } else {
            showSection('settings');
            showToast('Please set your API token first', 'error');
        }

        function saveToken() {
            API_TOKEN = document.getElementById('api-token').value;
            localStorage.setItem('awaj_token', API_TOKEN);
            showToast('Token saved successfully!', 'success');
            initData();
        }

        // Navigation
        function showSection(id) {
            document.querySelectorAll('.hidden-section').forEach(sec => sec.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(id === 'dashboard') checkBalance();
        }

        // Init App Data (Fetch Voices and Senders automatically)
        async function initData() {
            if(!API_TOKEN) return;
            checkBalance();
            await fetchVoices();
            await fetchSenders();
        }

        // Generate 20-char unique ID automatically
        function generateReqId() {
            return Math.random().toString(36).substring(2, 12) + Math.random().toString(36).substring(2, 12);
        }

        // Custom Toast Notification
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            toast.className = `${bgColor} text-white px-6 py-3 rounded shadow-lg opacity-0 transform translate-y-4 transition-all duration-300`;
            toast.innerText = message;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('opacity-0', 'translate-y-4'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Universal Fetch Wrapper
        async function apiCall(endpoint, method = 'GET', body = null, isFormData = false) {
            const headers = { 'Authorization': `Bearer ${API_TOKEN}` };
            if (!isFormData) {
                headers['Content-Type'] = 'application/json';
                headers['Accept'] = 'application/json';
            }
            const options = { method, headers };
            if (body) options.body = isFormData ? body : JSON.stringify(body);

            try {
                const res = await fetch(`${BASE_URL}${endpoint}`, options);
                const data = await res.json().catch(() => ({}));
                
                if (!res.ok) {
                    const errMsg = data.message || data.error || 'Request failed';
                    throw new Error(errMsg);
                }
                return data;
            } catch (err) {
                showToast(err.message, 'error');
                throw err;
            }
        }

        // 1. Check Balance
        async function checkBalance() {
            try {
                const data = await apiCall('/balance');
                document.getElementById('balance-display').innerText = data.balance !== undefined ? data.balance : '0.00';
            } catch (err) { document.getElementById('balance-display').innerText = 'Error'; }
        }

        // 2. Fetch Voices & Populate Dropdowns
        async function fetchVoices() {
            try {
                const voices = await apiCall('/voices');
                const options = '<option value="">Select a Voice</option>' + 
                    voices.map(v => `<option value="${v.name}">${v.name}</option>`).join('');
                document.querySelectorAll('.dynamic-voices').forEach(select => select.innerHTML = options);
            } catch (err) {}
        }

        // 3. Fetch Senders & Populate Dropdowns
        async function fetchSenders() {
            try {
                const senders = await apiCall('/senders');
                const options = '<option value="">Select a Sender</option>' + 
                    senders.map(s => `<option value="${s.number || s}">${s.number || s}</option>`).join('');
                document.querySelectorAll('.dynamic-senders').forEach(select => select.innerHTML = options);
            } catch (err) {}
        }

        // 4. Send OTP
        async function sendOTP(e) {
            e.preventDefault();
            const payload = {
                request_id: generateReqId(),
                sender: document.getElementById('otp-sender').value,
                voice: document.getElementById('otp-voice').value,
                phone_number: document.getElementById('otp-phone').value,
                otp_code: document.getElementById('otp-code').value
            };
            try {
                await apiCall('/broadcasts/otp', 'POST', payload);
                showToast('OTP request sent successfully!');
                e.target.reset();
            } catch (err) {}
        }

        // 5. Send Bulk Broadcast
        async function sendBulk(e) {
            e.preventDefault();
            const phoneStr = document.getElementById('bulk-phones').value;
            const phoneArr = phoneStr.split(',').map(num => num.trim()).filter(num => num);
            
            const payload = {
                request_id: generateReqId(),
                sender: document.getElementById('bulk-sender').value,
                voice: document.getElementById('bulk-voice').value,
                phone_numbers: phoneArr
            };
            try {
                await apiCall('/broadcasts', 'POST', payload);
                showToast(`Broadcast sent to ${phoneArr.length} numbers!`);
                e.target.reset();
            } catch (err) {}
        }

        // 6. Upload Voice
        async function uploadVoice(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('voice-name').value);
            formData.append('audio', document.getElementById('voice-file').files[0]);

            try {
                await apiCall('/voices/upload', 'POST', formData, true);
                showToast('Voice uploaded! Waiting for approval.');
                e.target.reset();
                setTimeout(fetchVoices, 2000);
            } catch (err) {}
        }

        // Start App
        if(API_TOKEN) showSection('dashboard');
    </script>
</body>
</html>
